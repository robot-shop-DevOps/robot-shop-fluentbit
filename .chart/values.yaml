image:
  repository: robotshopdevacr.azurecr.io/baseimages/fluent/fluent-bit
  tag: 4.1.0-internal
  pullPolicy: Always

env:
  - name: ES_USER
    valueFrom:
      secretKeyRef:
        name: elasticsearch
        key: ES_USER

  - name: ES_PASS
    valueFrom:
      secretKeyRef:
        name: elasticsearch
        key: ES_PASS

config:
  service: |
    flush: 1
    daemon: off
    log_level: info

  inputs: |
    pipeline:
      inputs:
        - name: tail
          path: /var/log/containers/*.log
          parser: cri
          tag: robotshop.<namespace_name>.<pod_name>.<container_name>
          tag_regex: '(?<pod_name>[^_]+)_(?<namespace_name>[^_]+)_(?<container_name>[^-]+)-(?<container_id>[a-z0-9]{64})\.log$'

  filters: |
    pipeline:
      filters:
        - name: kubernetes
          match: robotshop.*

  outputs: |
    pipeline:
      outputs:
        - name: es
          match: robotshop.*
          host: 10.0.2.10
          port: 9200
          http_user: ${ES_USER}
          http_password: ${ES_PASS}
          tls: off