image:
  repository: robotshopdevacr.azurecr.io/baseimages/fluent/fluent-bit
  tag: 4.1.0-internal
  pullPolicy: Always

env:
  - name: ES_USER
    valueFrom:
      secretKeyRef:
        name: elasticsearch
        key: ES_USER

  - name: ES_PASS
    valueFrom:
      secretKeyRef:
        name: elasticsearch
        key: ES_PASS

config:
  service: |
    [SERVICE]
        Flush         1
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf

  inputs: |
    [INPUT]
        Name       tail
        Path       /var/log/containers/*.log
        Parser     cri
        Tag        robotshop.${namespace_name}.${pod_name}.${container_name}
        Tag_Regex  (?<pod_name>[^_]+)_(?<namespace_name>[^_]+)_(?<container_name>[^-]+)-(?<container_id>[a-z0-9]{64})\.log$

  filters: |
    [FILTER]
        Name   kubernetes
        Match  robotshop.*

  outputs: |
    [OUTPUT]
        Name         es
        Match        robotshop.*
        Host         10.0.2.10
        Port         9200
        HTTP_User    ${ES_USER}
        HTTP_Passwd  ${ES_PASS}
        tls          Off